# Development environment: crm-api

environment: dev
data_classification: public

compute:
  cpu: 256
  memory: 512
  desired_count: 1

databases:
  - name: crm-db
    instance_class: db.t3.small
    num_instances: 1
  - name: crm-cache
    node_type: cache.t3.small
    num_cache_nodes: 1

monitoring:
  alarm_cpu_threshold: 95
  alarm_error_rate_threshold: 50

tags:
  Environment: dev
  Team: customertech
  CostCentre: CC-CRM-001
  DataClassification: public
